{% set title = title or "Portal" %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('portal.theme');
        var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {}
    })();
  </script>

  <style id="kv-page-width">
  .container { max-width: clamp(1100px, {{ HOMEPAGE_WIDTH }}, 1920px); }
</style>
</head>
<body>
  <header class="container">
    <div class="nav-bar">
      <h1 class="logo"><a href="/">Portal</a></h1>
      <nav class="top-nav" aria-label="Primary">
        <ul class="nav-list nav-left">
          {% for item in g.nav_links %}
            <li class="nav-item">
              <a href="{{ item.href }}" {% if item.new_tab %}target="_blank" rel="noopener"{% endif %}>{{ item.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul class="nav-list nav-right" style="margin-left:auto">
  {% if current_user.is_authenticated %}
    <li><a class="icon-link" href="{{ url_for('profile.profile_page') }}" title="Profile" aria-label="Profile">👤</a></li>
    <li><button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌓</button></li>
    <li><a class="icon-link" href="{{ url_for('settings.index') }}" title="Admin Settings" aria-label="Admin Settings">⚙️</a></li>
    <li><a class="icon-link" href="{{ url_for('auth.logout') }}" title="Logout" aria-label="Logout">⎋</a></li>
  {% else %}
    <li><button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌓</button></li>
    <li><a class="icon-link" href="{{ url_for('auth.login') }}" title="Login" aria-label="Login">⎆</a></li>
  {% endif %}
</ul>
      
</nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
      function setTheme(t){
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem('portal.theme', t); } catch(e){}
      }
      btn.addEventListener('click', function(){
        var t = currentTheme() === 'light' ? 'dark' : 'light';
        setTheme(t);
      });
    })();
  </script>
</body>
</html>
