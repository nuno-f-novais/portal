{% if current_user.is_authenticated %}
  <a href="{{ url_for('auth.me') }}" class="nav-link">Profile ({{ (current_user.roles or [None])[0] }})</a>
  <a href="{{ url_for('auth.logout') }}" class="nav-link">Sign out</a>
{% else %}
  <a href="{{ url_for('auth.login') }}" class="nav-link">Sign in</a>
{% endif %}
