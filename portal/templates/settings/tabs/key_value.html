
{# templates/settings/tabs/key_value.html #}
<div id="tab-kv" class="tab-panel" data-label="Key/Value Settings" hidden aria-hidden="true">
  <section class="card panel">
    <div class="panel-head">
      <h2>Key/Value Settings</h2>
      <div class="panel-actions">
        <button id="kv-add" class="btn btn-secondary" type="button">Add row</button>
        <button id="kv-save" class="btn btn-primary" type="button">Save changes</button>
      </div>
    </div>
    <p class="muted">Generic application settings stored in the database. Avoid using reserved key <code>portal_settings</code>.</p>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th style="width:40%;">Key</th><th>Value</th><th style="width:80px;">Remove</th></tr></thead>
        <tbody id="kv-body"></tbody>
      </table>
    </div>
  </section>
</div>
