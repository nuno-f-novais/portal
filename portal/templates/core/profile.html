{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header"><h2>Profile</h2></div>
  <div class="card-body">
    <ul>
      <li><strong>Username:</strong> {{ username }}</li>
      <li><strong>User ID:</strong> {{ user_id }}</li>
      <li><strong>Roles:</strong>
        {% if roles and roles|length %}
          {{ roles|join(", ") }}
        {% else %}
          <em>none</em>
        {% endif %}
      </li>
      <li><strong>Is Admin:</strong> {{ is_admin }}</li>
    </ul>
  </div>
</div>
{% endblock %}
