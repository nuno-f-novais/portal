{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto;padding:1rem">
  <h2>{{ title }}</h2>
  <form method="post" style="display:grid;grid-template-columns:1fr;gap:.5rem">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" style="margin-top:.5rem">Sign in</button>
  </form>
  <div style="margin-top:1rem;display:flex;gap:.75rem;flex-wrap:wrap">
    <a href="{{ url_for('auth.register') }}">Create account</a>
    <a href="{{ url_for('auth.oidc_login') }}">Sign in with OIDC</a>
    <a href="{{ url_for('auth.saml_login') }}">Sign in with SAML</a>
  </div>
</div>
{% endblock %}
