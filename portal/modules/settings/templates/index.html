
{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>

<div class="grid-settings">
  <!-- Portal Icons -->
  <section class="card" style="padding:1rem;">
    <h3>Portal Icons (Links)</h3>
    <div class="table-wrap">
      <table id="icons-table" class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>URL</th>
            <th>Icon</th>
            <th>In Nav</th>
            <th>On Home</th>
            <th>Enabled</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input placeholder="New Link" value="{{ (portal_icons|list)[0].title if portal_icons else 'New Link' }}"></td>
            <td><input placeholder="/" value="{{ (portal_icons|list)[0].url if portal_icons else '/' }}"></td>
            <td><input placeholder="link" value="{{ (portal_icons|list)[0].icon if portal_icons else 'link' }}"></td>
            <td><input type="checkbox" {% if (portal_icons|list)[0].show_in_nav if portal_icons else false %}checked{% endif %}></td>
            <td><input type="checkbox" {% if (portal_icons|list)[0].show_in_home if portal_icons else true %}checked{% endif %}></td>
            <td><input type="checkbox" {% if (portal_icons|list)[0].enabled if portal_icons else true %}checked{% endif %}></td>
          </tr>
        </tbody>
      </table>
    </div>
    <button id="add-icon" class="btn" style="float:right;margin-top:.5rem">Add Icon</button>
  </section>

  <!-- Modules -->
  <section class="card" style="padding:1rem;">
    <h3>Modules</h3>
    <div class="table-wrap">
      <table id="modules-table" class="table">
        <thead>
          <tr>
            <th>Key</th>
            <th>Label</th>
            <th>Nav</th>
            <th>Home</th>
            <th>Enabled</th>
            <th>Anonymous</th>
            <th>Roles (CSV)</th>
          </tr>
        </thead>
        <tbody>
        {% for r in modules %}
          <tr data-key="{{ r.name }}">
            <td>{{ r.name }}</td>
            <td><input value="{{ r.label }}"></td>
            <td><input type="checkbox" {% if r.show_in_nav %}checked{% endif %}></td>
            <td><input type="checkbox" {% if r.show_in_home %}checked{% endif %}></td>
            <td><input type="checkbox" {% if r.enabled %}checked{% endif %}></td>
            <td><input type="checkbox" {% if r.anonymous %}checked{% endif %}></td>
            <td><input placeholder="e.g. admin, user" value="{{ r.roles|join(', ') }}"></td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
    <button id="save-modules" class="btn primary" style="margin-top:.75rem">Save</button>
  </section>
</div>

<script>
(function(){
  // Save modules
  const saveBtn = document.getElementById('save-modules');
  if(saveBtn){
    saveBtn.addEventListener('click', async () => {
      const rows = Array.from(document.querySelectorAll('#modules-table tbody tr'));
      const modules = {};
      rows.forEach(tr => {
        const tds = tr.children;
        const key = tr.dataset.key;
        modules[key] = {
          label: tds[1].querySelector('input').value.trim(),
          show_in_nav: tds[2].querySelector('input').checked,
          show_in_home: tds[3].querySelector('input').checked,
          enabled: tds[4].querySelector('input').checked,
          anonymous: tds[5].querySelector('input').checked,
          roles: (tds[6].querySelector('input').value||'').split(',').map(s=>s.trim()).filter(Boolean),
        };
      });
      const payload = { icons: [], modules };
      const r = await fetch('/settings/modules', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if(r.ok){ location.reload(); } else { alert('Failed to save'); }
    });
  }
})();
</script>
{% endblock %}
