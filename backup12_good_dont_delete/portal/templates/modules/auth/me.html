{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:520px;margin:2rem auto;padding:1rem">
  <h2>{{ title }}</h2>
  <ul class="list">
    <li><strong>Username:</strong> {{ current_user.username }}</li>
    <li><strong>Email:</strong> {{ current_user.email }}</li>
    <li><strong>Role:</strong> <span class="badge">{{ (current_user.roles or [None])[0] }}</span></li>
  </ul>
</div>
{% endblock %}
