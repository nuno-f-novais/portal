
{% extends "base.html" %}
{% block content %}
  <h2>{{ title }}</h2>
  <form method="post" class="card" style="padding:1rem;max-width:560px">
    <div class="form-row">
      <label for="message">Message</label>
      <input id="message" name="message" value="{{ settings.message }}">
    </div>
    <button class="btn primary">Save</button>
  </form>
{% endblock %}
