{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<ul class="list">
  <li><strong>Python:</strong> {{ info.python_version }}</li>
  <li><strong>Platform:</strong> {{ info.platform }}</li>
  <li><strong>PID:</strong> {{ info.pid }}</li>
  <li><strong>Server Time:</strong> {{ info.time }}</li>
  <li><strong>Debug:</strong> {{ info.debug }}</li>
  <li><strong>Your IP:</strong> {{ info.remote_addr }}</li>
</ul>
{% endblock %}
