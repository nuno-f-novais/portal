{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" class="card" style="margin-bottom: 1rem;">
  <label for="text">New note</label>
  <input id="text" type="text" name="text" placeholder="Type something..." />
  <button type="submit">Add</button>
</form>
{% if notes %}
  <ul class="list">
    {% for n in notes %}
      <li>{{ n }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>No notes yet.</p>
{% endif %}
{% endblock %}
