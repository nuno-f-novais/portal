{%- macro quick_card(item) -%}
<a href="{{ item.item_url }}" class="text-decoration-none"{% if item.open_in_new_tab %} target="_blank" rel="noopener"{% endif %}>
  <div class="card h-100 shadow-sm hover-lift">
    <div class="card-body d-flex align-items-center gap-3">
      <i class="{{ item.icon }} fs-3"></i>
      <div>
        <div class="fw-semibold">{{ item.title }}</div>
        {%- if item.item_url -%}
        <div class="text-muted small">{{ item.item_url }}</div>
        {%- endif -%}
      </div>
    </div>
  </div>
</a>
{%- endmacro -%}
