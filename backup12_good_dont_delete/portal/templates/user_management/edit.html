{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="page-header">
    <div>
      <h1 class="title">Edit user</h1>
      <p class="subtitle">Update account details and roles.</p>
    </div>
  </div>
  <form method="post" class="card form-card">
    
  <div class="grid two">
    <div>
      <label class="form-label">Username</label>
      <input type="text" class="input" name="username" value="{{ (user.username if user else username) or '' }}" required>
    </div>
    <div>
      <label class="form-label">Password{% if true %} <span class="muted">(leave blank to keep)</span>{% endif %}</label>
      <input type="password" class="input" name="password" {% if not user %}required{% endif %}>
    </div>
  </div>
  <div>
    <label class="form-label">Roles <span class="muted">(comma-separated)</span></label>
    <input type="text" class="input" name="roles" value="{{ roles_str or '' }}">
  </div>

    <div class="form-actions">
      <button class="btn btn-primary">Save</button>
      <a href="{{ url_for('user_management.index') }}" class="btn btn-plain">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
